<text class="lab" x="1220" y="424" text-anchor="end">Hand speed, inches per second</text>
<text class="lab" x="588" y="58" text-anchor="end">Sens</text>
<line class="flat" x1="600" x2="1220" y1="309.8" y2="309.8"/>
<text class="lab" x="1220" y="331.8" text-anchor="end">Without a curve: 0.35 everywhere</text>
