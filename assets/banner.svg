<text class="lab" x="1220" y="424" text-anchor="end">Hand speed, inches per second</text>
<text class="lab" x="588" y="58" text-anchor="end">Sens</text>
<line class="flickline" x1="724" x2="724" y1="72" y2="372"/>
<line class="today" x1="600" x2="1220" y1="247.6" y2="247.6"/>
<text class="lab" x="1220" y="269.6" text-anchor="end">Your sens today: 0.35</text>
