<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
<title id="t">Sensline</title>
<desc id="d">A RawAccel curve for Valorant. Sensitivity stays at 0.35 for slow aim, rises to 0.362 for a 20 inch per second flick and 0.413 for a 60 inch per second turn.</desc>
<style>
  .bg { fill: #f2f5f1; } .ink { fill: #141a16; } .soft { fill: #56605a; }
  .grid { stroke: #dde2dc; stroke-width: 1; } .tick { fill: #56605a; font: 13px "Segoe UI", system-ui, sans-serif; }
  .flat { stroke: #858e87; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
  .curve { stroke: #2f7d32; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .area { fill: #2f7d32; opacity: .08; }
  .ring { fill: #f2f5f1; stroke: #2f7d32; stroke-width: 3; }
  .dot { fill: #2f7d32; }
  .mk-v { fill: #141a16; font: 600 20px Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif; }
  .mk-t { fill: #56605a; font: 13px "Segoe UI", system-ui, sans-serif; }
  .brand { fill: #141a16; font: 600 64px Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif; letter-spacing: -1px; }
  .tag { fill: #56605a; font: 21px "Segoe UI", system-ui, sans-serif; }
  .lab { fill: #56605a; font: 13px "Segoe UI", system-ui, sans-serif; }
  .mark-bg { fill: #141a16; } .mark-p { fill: none; stroke: #7fdc5a; stroke-width: 3.5; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #101412; } .ink, .brand, .mk-v { fill: #edf2ee; } .soft, .tick, .mk-t, .tag, .lab { fill: #a8b3ab; }
    .grid { stroke: #262d28; } .flat { stroke: #8b958d; } .curve { stroke: #7fdc5a; } .area, .dot { fill: #7fdc5a; }
    .ring { fill: #101412; stroke: #7fdc5a; } .mark-bg { fill: #27302a; }
  }

  /* 9 s loop: draw the curve, call out three speeds, run a dot along it, then reset. */
  .curve { stroke-dasharray: 1000; animation: draw 9s cubic-bezier(.4,0,.2,1) infinite; }
  .area { animation: area 9s ease infinite; }
  .mk { opacity: 0; animation: mk 9s ease infinite; }
  .mk1 { animation-name: mk1; } .mk2 { animation-name: mk2; }
  .dot { opacity: 0; animation: dot 9s linear infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 1000; } 26% { stroke-dashoffset: 0; } 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes area { 0%, 20% { opacity: 0; } 32%, 92% { opacity: .08; } 100% { opacity: 0; } }
  @keyframes mk  { 0%, 27% { opacity: 0; } 31%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes mk1 { 0%, 32% { opacity: 0; } 36%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes mk2 { 0%, 37% { opacity: 0; } 41%, 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes dot { 0%, 44% { opacity: 0; } 46%, 86% { opacity: 1; } 89%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .curve, .area, .mk, .dot { animation: none; } .mk { opacity: 1; } .area { opacity: .08; } .dot { opacity: 0; }
  }
</style>
<rect class="bg" width="1280" height="440" rx="18"/>

<g transform="translate(64 128)">
  <g transform="scale(1.6)"><rect class="mark-bg" width="32" height="32" rx="7"/><path class="mark-p" d="M6 22h6c5 0 7-12 14-12"/></g>
  <text class="brand" x="70" y="46">Sensline</text>
  <text class="tag" x="0" y="122">A RawAccel curve for Valorant,</text>
  <text class="tag" x="0" y="152">built from how you really aim.</text>
  <text class="lab" x="0" y="216">Aim test, curve builder and install steps for RawAccel 1.6 and 1.7.</text>
  <text class="lab" x="0" y="238">Runs in your browser. Nothing leaves your PC.</text>
</g>

